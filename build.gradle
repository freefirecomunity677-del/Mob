plugins {
    id 'java'
}

group = 'com.freefirecomunity677del'
version = '1.0.0'

repositories {
    mavenCentral()
    maven { url = 'https://repo.papermc.io/repository/maven-public/' }
}

dependencies {
    compileOnly 'io.papermc.paper:paper-api:26.1.2.build.23-alpha'
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(25)
}

jar {
    archiveBaseName = 'MobPowers'
}
